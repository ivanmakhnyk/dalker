[package]
name = "dalker-webrtc"
description = "WebRTC media pipeline for Dalker: H.264 video track + \"control\" DataChannel."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dalker-core.workspace = true
tokio.workspace = true
bytes.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
webrtc.workspace = true
openh264.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# dlopen of libva for the VA-API hardware encoder.
libc.workspace = true

[target.'cfg(windows)'.dependencies.windows]
# The Media Foundation hardware H.264 encoder.
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
]
