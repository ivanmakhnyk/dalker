[package]
name = "dalker-mcp"
description = "Model Context Protocol server for Dalker: lets an AI agent see and operate the host like a viewer."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dalker-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
http-body = "1"
argon2.workspace = true
rand.workspace = true
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "base64", "transport-streamable-http-server"] }
schemars = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.23"

[dev-dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }
