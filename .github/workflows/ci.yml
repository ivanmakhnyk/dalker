name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # OpenH264 without its assembly encodes several times slower; fail instead (see dalker-webrtc/build.rs).
  DALKER_REQUIRE_NASM: 1

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # New key: older caches hold an OpenH264 built without NASM.
          key: openh264-asm

      # The settings window's web view (WebKitGTK) on Linux.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: NASM (OpenH264 assembly)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Version is consistent
        shell: bash
        run: sh scripts/version.sh check

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Warnings are reported but don't fail the build yet; deny-level lints do.
      # Tighten with `-- -D warnings` once the existing warnings are cleaned up.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked
