name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # OpenH264 without its assembly encodes several times slower; fail instead (see dalker-webrtc/build.rs).
  DALKER_REQUIRE_NASM: 1

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Dependency licenses must be allowed by deny.toml (see CONTRIBUTING.md, "Third-party code").
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # Known vulnerabilities (RustSec) in dependencies. Its own job, so a new advisory shows up as
  # one red check instead of hiding the build results; it also runs weekly (advisories.yml).
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    # Fixed names, because required checks are matched by name.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # New key: older caches hold an OpenH264 built without NASM.
          key: openh264-asm

      # The settings window's web view (WebKitGTK) on Linux.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: NASM (OpenH264 assembly)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Version is consistent
        shell: bash
        run: sh scripts/version.sh check

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
