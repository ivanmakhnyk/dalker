name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you considered.
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - Windows host
        - Linux host
        - macOS host
        - Web viewer
        - MCP / AI agents
